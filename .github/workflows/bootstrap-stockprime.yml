name: Bootstrap StockPrime

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap-stockprime.yml'

permissions:
  contents: write

jobs:
  copiar-projeto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio de destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar StockPrime do repositorio anterior
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/Involute42/Aula_Topicos_DEV.git /tmp/aula_topicos
          cp -a /tmp/aula_topicos/StockPrime/. .
          if [ -f README-STOCKPRIME.md ]; then
            mv -f README-STOCKPRIME.md README.md
          fi

      - name: Publicar projeto na raiz
        shell: bash
        run: |
          git config user.name "Involute42"
          git config user.email "194590@upf.br"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para publicar."
          else
            git commit -m "Adiciona projeto StockPrime"
            git push origin HEAD:main
          fi
