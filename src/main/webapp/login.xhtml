<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <f:facet name="first">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
    </f:facet>
    <title>Login - StockPrime</title>
</h:head>
<h:body styleClass="login-body">
    <h:form id="loginForm">
        <p:growl id="growl" showDetail="true"/>
        <div class="grid grid-nogutter">
            <div class="col-12" style="text-align:center"><div class="login-brand"><i class="pi pi-box"></i><span>StockPrime</span></div></div>
        </div>
        <div class="login-panel">
            <div class="grid">
                <div class="col-12 lg:col-6 left-side"><p:graphicImage name="images/login/login-photo.png" library="manhattan-layout" class="login-image"/></div>
                <div class="col-12 lg:col-6 right-side ui-fluid">
                    <div class="col-12 container"><h3>Bem-vindo!</h3><h2>Acesse o Controle de Estoque</h2></div>
                    <div class="col-12"><div class="input-wrapper ui-input-icon-left"><i class="pi pi-user"/><p:inputText id="email" value="#{loginController.usuario.email}" required="true" requiredMessage="Informe o e-mail." placeholder="E-mail"/></div></div>
                    <div class="col-12"><div class="input-wrapper ui-input-icon-left"><i class="pi pi-lock"/><p:password id="senha" value="#{loginController.usuario.senha}" required="true" requiredMessage="Informe a senha." placeholder="Senha" feedback="false"/></div></div>
                    <div class="col-12 button-container"><p:commandButton value="Acessar" icon="pi pi-sign-in" update="@form" action="#{loginController.validarLogin}"/></div>
                    <div class="col-12"><div class="login-help"><strong>Acesso acadêmico:</strong><br/>admin@estoque.com / 123</div></div>
                </div>
            </div>
        </div>
    </h:form>
    <h:outputStylesheet name="css/primeicons.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/primeflex.min.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/layout-cyan-deeporange.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/estoque.css"/>
</h:body>
</html>
