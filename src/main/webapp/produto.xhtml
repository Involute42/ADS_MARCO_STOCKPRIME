<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="title">Produtos - StockPrime</ui:define>
    <ui:define name="content">
        <h:form id="frmProduto">
            <p:growl id="growl" showDetail="true"/>
            <div class="page-header"><div><h1>Produtos</h1><p>Controle do catálogo e do saldo atual.</p></div></div>
            <p:card>
                <div class="toolbar-row">
                    <span class="ui-input-icon-left search-box"><i class="pi pi-search"/><p:inputText value="#{produtoController.busca}" placeholder="Buscar código, produto ou categoria" style="width:100%"><p:ajax event="keyup" update="tabela" delay="300"/></p:inputText></span>
                    <p:commandButton value="Novo produto" icon="pi pi-plus" actionListener="#{produtoController.prepararNovo}" update=":dlgProdutoForm" oncomplete="PF('dlgProduto').show()"/>
                </div>
                <p:dataTable id="tabela" value="#{produtoController.produtosFiltrados}" var="p" paginator="true" rows="8" emptyMessage="Nenhum produto encontrado." responsiveLayout="scroll">
                    <p:column headerText="Código" style="width:100px"><h:outputText value="#{p.codigo}"/></p:column>
                    <p:column headerText="Produto"><h:outputText value="#{p.nome}"/></p:column>
                    <p:column headerText="Categoria"><h:outputText value="#{p.categoria.nome}"/></p:column>
                    <p:column headerText="Fornecedor"><h:outputText value="#{p.fornecedor.razaoSocial}"/></p:column>
                    <p:column headerText="Preço" style="width:110px"><h:outputText value="#{p.preco}"><f:convertNumber type="currency" currencySymbol="R$" locale="pt_BR"/></h:outputText></p:column>
                    <p:column headerText="Estoque" style="width:90px;text-align:center"><span class="badge-status #{p.estoqueBaixo ? 'badge-low' : 'badge-ok'}">#{p.estoqueAtual}</span></p:column>
                    <p:column headerText="Status" style="width:90px"><span class="badge-status #{p.status.descricao == 'Ativo' ? 'badge-ok' : 'badge-inactive'}">#{p.status.descricao}</span></p:column>
                    <p:column headerText="Ações" style="width:130px;text-align:center">
                        <p:commandButton icon="pi pi-pencil" styleClass="ui-button-rounded ui-button-text" actionListener="#{produtoController.setSelected(p)}" action="#{produtoController.prepararEdicao}" update=":dlgProdutoForm" oncomplete="PF('dlgProduto').show()"/>
                        <p:commandButton icon="pi pi-trash" styleClass="ui-button-rounded ui-button-text ui-button-danger" actionListener="#{produtoController.setSelected(p)}" oncomplete="PF('confirmProdutoWidget').show()"/>
                    </p:column>
                </p:dataTable>
            </p:card>
        </h:form>

        <p:dialog widgetVar="dlgProduto" header="Produto" modal="true" resizable="false" width="760">
            <h:form id="dlgProdutoForm">
                <p:messages showDetail="true"/>
                <div class="form-grid">
                    <div class="form-field"><p:outputLabel for="codigo" value="Código"/><p:inputText id="codigo" value="#{produtoController.produto.codigo}" required="true" requiredMessage="Informe o código." maxlength="20"/></div>
                    <div class="form-field"><p:outputLabel for="nome" value="Nome"/><p:inputText id="nome" value="#{produtoController.produto.nome}" required="true" requiredMessage="Informe o nome." maxlength="80"/></div>
                    <div class="form-field"><p:outputLabel for="categoria" value="Categoria"/><p:selectOneMenu id="categoria" value="#{produtoController.categoriaId}" required="true" requiredMessage="Selecione a categoria."><f:selectItem itemLabel="Selecione" itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{produtoController.categorias}" var="c" itemValue="#{c.id}" itemLabel="#{c.nome}"/></p:selectOneMenu></div>
                    <div class="form-field"><p:outputLabel for="fornecedor" value="Fornecedor"/><p:selectOneMenu id="fornecedor" value="#{produtoController.fornecedorId}" required="true" requiredMessage="Selecione o fornecedor."><f:selectItem itemLabel="Selecione" itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{produtoController.fornecedores}" var="f" itemValue="#{f.id}" itemLabel="#{f.razaoSocial}"/></p:selectOneMenu></div>
                    <div class="form-field"><p:outputLabel for="preco" value="Preço"/><p:inputNumber id="preco" value="#{produtoController.produto.preco}" symbol="R$ " symbolPosition="p" minValue="0" decimalPlaces="2" required="true"/></div>
                    <div class="form-field"><p:outputLabel for="status" value="Status"/><p:selectOneMenu id="status" value="#{produtoController.produto.status}"><f:selectItems value="#{produtoController.statusDisponiveis}" var="s" itemValue="#{s}" itemLabel="#{s.descricao}"/></p:selectOneMenu></div>
                    <div class="form-field"><p:outputLabel for="estoque" value="Estoque atual"/><p:inputNumber id="estoque" value="#{produtoController.produto.estoqueAtual}" minValue="0" decimalPlaces="0" required="true"/></div>
                    <div class="form-field"><p:outputLabel for="minimo" value="Estoque mínimo"/><p:inputNumber id="minimo" value="#{produtoController.produto.estoqueMinimo}" minValue="0" decimalPlaces="0" required="true"/></div>
                    <div class="form-field full"><p:outputLabel for="descricao" value="Descrição"/><p:inputTextarea id="descricao" value="#{produtoController.produto.descricao}" rows="3" maxlength="220"/></div>
                </div>
                <div class="dialog-actions">
                    <p:commandButton value="Cancelar" type="button" styleClass="ui-button-secondary ui-button-outlined" onclick="PF('dlgProduto').hide()"/>
                    <p:commandButton value="Salvar" icon="pi pi-save" action="#{produtoController.salvarOuAtualizar}" update=":frmProduto :dlgProdutoForm" oncomplete="if(!args.validationFailed) PF('dlgProduto').hide()"/>
                </div>
            </h:form>
        </p:dialog>

        <h:form id="confirmProdutoForm">
            <p:confirmDialog widgetVar="confirmProdutoWidget" header="Confirmar exclusão" message="Deseja excluir o produto selecionado?" severity="warn">
            <p:commandButton value="Não" type="button" onclick="PF('confirmProdutoWidget').hide()" styleClass="ui-button-secondary"/>
            <p:commandButton value="Sim" icon="pi pi-trash" action="#{produtoController.excluir}" update=":frmProduto" oncomplete="PF('confirmProdutoWidget').hide()" styleClass="ui-button-danger"/>
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
